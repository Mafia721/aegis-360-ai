# Aegis-360 monitoring tmux config
# Loaded with: tmux -f monitor/tmux.conf new-session ...
# Does NOT overwrite ~/.tmux.conf

# Mouse and history
set -g mouse on
set -g history-limit 50000

# Use 256-color terminal
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Reduce escape-time for faster key response
set -sg escape-time 10

# Show pane titles in borders
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"

# Status bar — refreshes every 5 s
set -g status-interval 5
set -g status-style "bg=colour234,fg=colour250"

set -g status-left-length 30
set -g status-left "#[fg=colour39,bold] #S #[fg=colour238]│#[default] "

set -g status-right-length 80
set -g status-right "#(bash /home/kali/aegis-360-ai-master/monitor/statusline.sh) #[fg=colour238]│ #[fg=colour250]%H:%M %d-%b"

# Window styling
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=colour39,bold] #I:#W #[default]"
set -g window-status-separator ""

# Pane numbering starts at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix: keep Ctrl-b (default), also add Ctrl-a
set -g prefix C-b
bind C-a send-prefix

# Easy pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload this config
bind r source-file /home/kali/aegis-360-ai-master/monitor/tmux.conf \; display "aegis tmux.conf reloaded"
